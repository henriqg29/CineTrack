<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineTrack - Cadastro</title>
    <link rel="stylesheet" href="css/login.css">

</head>

<body>
    <!-- Container principal -->
    <main class="login-container">
        <!-- Cartão de cadastro -->
        <div class="login-card">
            <!-- Nome do sistema -->
            <h1>CineTrack</h1>
            <!-- Subtítulo -->
            <p class="subtitulo">
                Crie sua conta
            </p>
            <!-- Formulário -->
            <form id="cadastroForm">
                <!-- Campo de nome -->
                <div class="campo">
                    <label for="nome">
                        Nome
                    </label>
                    <input
                        type="text"
                        id="nome"
                        placeholder="Digite seu nome"
                        required>
                </div>
                <!-- Campo de email -->
                <div class="campo">
                    <label for="email">
                        Email
                    </label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Digite seu e-mail"
                        required>
                </div>
                <!-- Campo de senha -->
                <div class="campo">
                    <label for="senha">
                        Senha
                    </label>
                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha"
                        required>
                </div>
                <!-- Botão de cadastro -->
                <button type="submit">
                    Criar conta
                </button>
            </form>
            <!-- Mensagem de erro ou sucesso -->
            <p id="mensagem"></p>
            <!-- Link para voltar ao login -->
            <p class="cadastro-link">
                Já possui uma conta?
                <a href="index.html">
                    Entrar
                </a>
            </p>
        </div>
    </main>


    <!-- Conecta o JavaScript de autenticação -->
    <script src="js/auth.js"></script>

</body>

</html>
